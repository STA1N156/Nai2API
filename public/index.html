<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nai2API 图像生成工作台" />
    <meta name="theme-color" content="#f2f0e9" />
    <title>Nai2API · 图像工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="user-shell">
      <section class="panel token-panel" aria-labelledby="tokenTitle">
        <div class="panel-title token-summary">
          <span id="tokenStatusDot" class="status-dot" aria-hidden="true"></span>
          <div>
            <span class="eyebrow">Access</span>
            <h1 id="tokenTitle">连接密钥</h1>
            <span id="balanceText">尚未连接</span>
          </div>
        </div>
        <label>
          <span>当前密钥</span>
          <input id="userToken" autocomplete="off" spellcheck="false" placeholder="STA1N-..." />
        </label>
        <button id="saveTokenBtn" class="secondary token-submit">加载密钥</button>

        <div id="mergePanel" class="merge-panel">
          <button id="toggleMergeBtn" class="ghost wide merge-toggle" type="button" aria-expanded="false" aria-controls="mergeFields">
            <span>融合另一个密钥的额度</span>
            <span id="mergeToggleHint" class="merge-toggle-hint" aria-hidden="true"></span>
          </button>
          <div id="mergeFields" class="merge-fields" hidden>
            <label>
              <span>被融合的密钥</span>
              <input id="mergeSourceToken" autocomplete="off" spellcheck="false" placeholder="STA1N-..." />
            </label>
            <button id="mergeTokenBtn" class="secondary">确认融合</button>
          </div>
        </div>
      </section>

      <section class="panel composer-panel" aria-labelledby="composerTitle">
        <div class="panel-title">
          <div>
            <span class="eyebrow">Create / 01</span>
            <h2 id="composerTitle">描述画面</h2>
          </div>
        </div>

        <div class="form-section prompt-section">
          <div class="prompt-field-head">
            <label for="promptInput">提示词</label>
            <button id="promptConvertBtn" class="secondary prompt-convert-btn" type="button">中文转提示词</button>
          </div>
          <textarea id="promptInput" rows="7">1girl, solo, long silver hair drifting in the rain, luminous blue eyes, standing beneath a transparent umbrella on a quiet neon-lit street at night, wet pavement, colorful reflections, distant storefront glow, soft drifting mist, gentle wind, cinematic composition, moody atmosphere, deep blue and warm amber lighting, delicate rim light, volumetric rain, shallow depth of field, soft bokeh, subtle film grain, highly detailed background, delicate facial features, masterpiece, best quality</textarea>
        </div>

        <div class="form-section">
          <div class="form-section-title">
            <span>02</span>
            <strong>生成参数</strong>
          </div>
          <div class="grid-two">
            <label>
              <span>采样器</span>
              <select id="samplerInput">
                <option value="k_dpmpp_2m_sde">DPM++ 2M SDE</option>
                <option value="k_dpmpp_2m">DPM++ 2M</option>
                <option value="k_dpmpp_sde">DPM++ SDE</option>
                <option value="k_dpmpp_2s_ancestral">DPM++ 2S Ancestral</option>
                <option value="k_euler_ancestral">Euler Ancestral</option>
                <option value="k_euler">Euler</option>
              </select>
            </label>
            <label>
              <span>画幅与分辨率</span>
              <select id="sizeInput">
                <option>竖图</option>
                <option>横图</option>
                <option>方图</option>
              </select>
            </label>
          </div>

          <div class="grid-three param-grid">
            <label>
              <span>步数</span>
              <input id="stepsInput" type="number" min="1" max="28" value="28" />
            </label>
            <label>
              <span>Scale</span>
              <input id="scaleInput" type="number" min="1" max="20" step="0.5" value="6" />
            </label>
            <label>
              <span>CFG</span>
              <input id="cfgInput" type="number" min="0" max="1" step="0.05" value="0" />
            </label>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">
            <span>03</span>
            <strong>风格控制</strong>
          </div>
          <label>
            <span>Artist / 质量前缀</span>
            <select id="artistPresetInput">
              <option value="fresh">韩漫小清新风</option>
              <option value="comicDoujin">漫画同人风</option>
              <option value="2.5d">2.5D 唯美风</option>
              <option value="lolita25d">2.5D 唯美风（萝）</option>
              <option value="doujin">本子里番风</option>
              <option value="galgame">GalGame 风</option>
              <option value="custom">自定义</option>
            </select>
            <textarea id="artistInput" rows="7"></textarea>
          </label>
          <label>
            <span>负面提示词</span>
            <textarea id="negativeInput" rows="7"></textarea>
          </label>
        </div>
      </section>

      <section class="panel result-panel" aria-labelledby="resultTitle">
        <div class="panel-title result-heading">
          <div class="result-title-main">
            <span class="eyebrow">Output</span>
            <div class="result-title-row">
              <div>
                <h2 id="resultTitle">生成预览</h2>
                <span id="jobText"></span>
              </div>
              <div class="panel-actions result-actions">
                <div id="generationCountControl" class="generation-count-control" role="group" aria-label="生图数量">
                  <span>数量</span>
                  <button class="selected" type="button" data-generation-count="1" aria-pressed="true">1</button>
                  <button type="button" data-generation-count="2" aria-pressed="false">2</button>
                  <button type="button" data-generation-count="4" aria-pressed="false">4</button>
                </div>
                <button id="copySnippetTopBtn" class="secondary">复制嵌入代码</button>
                <button id="directGenerateBtn" class="primary">生成图片 <span aria-hidden="true">→</span></button>
              </div>
            </div>
          </div>
        </div>

        <div id="imageFrame" class="image-frame"></div>
      </section>
    </main>

    <div id="resultPreview" class="image-preview hidden" aria-hidden="true">
      <button id="closeResultPreviewBtn" class="preview-close" type="button" aria-label="关闭预览">×</button>
      <button id="prevResultBtn" class="preview-nav preview-prev" type="button" aria-label="上一张">‹</button>
      <button id="nextResultBtn" class="preview-nav preview-next" type="button" aria-label="下一张">›</button>
      <div id="resultPreviewStage" class="preview-stage result-preview-stage">
        <div id="optimizeFluid" class="optimize-fluid" aria-hidden="true">
          <canvas id="optimizeWaveCanvas"></canvas>
          <strong>正在进行 4K 重构优化</strong>
        </div>
        <img id="resultPreviewImage" alt="生成图片预览" />
        <img id="comparisonPreviewImage" class="comparison-preview-image" alt="" aria-hidden="true" />
        <div id="comparisonSlider" class="comparison-slider" hidden>
          <span class="comparison-divider"><b aria-hidden="true">↔</b></span>
          <input id="comparisonRange" type="range" min="0" max="100" value="20" aria-label="拖动查看优化前后对比" />
        </div>
        <button id="optimizeImageBtn" class="preview-optimize-button" type="button">重构优化</button>
      </div>
    </div>

    <div id="promptConvertModal" class="prompt-convert-modal hidden" role="dialog" aria-modal="true" aria-labelledby="promptConvertTitle">
      <div class="prompt-convert-dialog">
        <div class="prompt-convert-head">
          <div>
            <span class="eyebrow">Prompt helper</span>
            <h2 id="promptConvertTitle">中文转 NAI 提示词</h2>
          </div>
          <button id="closePromptConvertBtn" class="prompt-convert-close" type="button" aria-label="关闭">×</button>
        </div>
        <label>
          <span>中文画面描述</span>
          <textarea id="promptConvertInput" rows="6" placeholder="例如：雨夜的霓虹街道上，一位银发少女撑着透明雨伞，电影感构图。"></textarea>
        </label>
        <p class="prompt-convert-note">转换不会扣除生成额度</p>
        <button id="promptConvertSubmitBtn" class="primary wide" type="button">转换并填入</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
